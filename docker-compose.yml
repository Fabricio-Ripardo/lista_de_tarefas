# Sobe o projeto inteiro: MariaDB + API Django + front-end Next.js
#   docker compose up --build
# Front-end: http://localhost:3000  |  API: http://localhost:8000/api/tasks/

services:
  mariadb:
    image: mariadb:11
    container_name: lista-tarefas-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-tarefas-dev}
      MARIADB_DATABASE: lista_de_tarefas
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: lista-tarefas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-dev}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_NAME: lista_de_tarefas
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-tarefas-dev}
      DB_HOST: mariadb
      DB_PORT: "3306"

  frontend:
    build:
      context: .
      dockerfile: ./dockerfile
    container_name: lista-tarefas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # As rotas /api do Next.js repassam as requisições para a API Django
      DJANGO_API_URL: http://backend:8000/api

volumes:
  mariadb_data:
